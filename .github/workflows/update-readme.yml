name: Auto Update README

on:
  schedule:
    - cron: '0 7 * * *'   # setiap hari jam 07:00 pagi (WIB kira-kira jam 14:00 UTC)
  workflow_dispatch:       # bisa dijalankan manual juga

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update README with current date
        run: |
          date=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s/{{DATE}}/$date/" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto update README at $date" || echo "No changes to commit"
          git push
